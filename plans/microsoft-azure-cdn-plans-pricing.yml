description: >-
  Published Azure CDN pricing, read from the Microsoft pricing page on 2026-09-17. This REPLACES the
  2026-05-04 API Evangelist scaffold, which invented Free / Professional / Enterprise tiers with
  request quotas. Azure CDN has no request-quota tiers at all: it is metered on outbound data transfer
  per geographic zone with volume bands, and the MANAGEMENT API (Microsoft.Cdn, the contract this repo
  catalogues) is not separately billed — ARM management calls are free and governed by throttling
  rather than price. See rate-limits/microsoft-azure-cdn-rate-limits.yml.
plan_count: 3
billing_model: usage-based (metered outbound data transfer, per zone, per volume band)
currency: USD
api_billed_separately: false
retirement_notice: >-
  The pricing page itself carries the retirement notice: "Azure CDN Standard from Microsoft (classic)
  is in the process of retiring. As of October 1, 2025, no new instances will be created. On
  September 30, 2027, it will be retired."
zones:
  note: Zone 1-5 are geographic bands defined in the pricing page FAQ; TB = 1,000 GB for Microsoft (classic) S3.
plans:

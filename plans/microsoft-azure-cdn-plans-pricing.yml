    source: https://azure.microsoft.com/en-us/pricing/details/web-application-firewall/
related_products:
  - name: Content Delivery Network Premium
    note: >-
      The pricing page also lists a Premium CDN tier with rules engine and real-time analytics. Its
      per-GB bands were not captured because the Premium tier is delivered by a partner network rather
      than the Microsoft.Cdn Standard_Microsoft SKU this repo's contract centres on; recorded as a known
      gap rather than filled in.
  - name: Azure Front Door
    url: https://azure.microsoft.com/en-us/pricing/details/frontdoor/
    note: The successor product Microsoft directs migrating customers to.

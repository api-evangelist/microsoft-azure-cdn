domain_standard:
  applicable: false
  note: >-
    REWARD-ONLY check, deliberately left unclaimed. Content delivery has no cross-vendor contract
    standard — no CDN equivalent of SCIM, FHIR, OpenRTB or ISO 20022 exists, and the nearest things
    (RFC 9111 HTTP caching, RFC 8555 ACME for managed certificates) are protocols the product
    implements at the data plane, not standards this MANAGEMENT contract declares. Nothing in the
    Microsoft.Cdn spec carries a domain-standard URN, schema identifier or message type. Recorded as
    not applicable rather than invented to fill the slot.

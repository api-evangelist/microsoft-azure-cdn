name: Microsoft Azure Cdn
aid: microsoft-azure-cdn
description: 'Azure Content Delivery Network (CDN) caches static web content at strategically placed edge
  locations to deliver it to users with maximum throughput and minimum latency. The product is operated
  through the Microsoft.Cdn Azure Resource Manager resource provider, a 115-operation REST contract on
  management.azure.com that manages CDN profiles, delivery endpoints, origins, origin groups, custom domains
  and web application firewall policies, and that also serves the Azure Front Door Standard and Premium
  resource family. Authentication is Microsoft Entra ID OAuth 2.0 with authorization decided by Azure
  RBAC. Azure CDN Standard from Microsoft (classic) is on a published retirement path: it stopped accepting
  new instances in 2025 and retires on 30 September 2027, with Microsoft directing customers to Azure
  Front Door and shipping a validate/migrate/commit API path for the move.'

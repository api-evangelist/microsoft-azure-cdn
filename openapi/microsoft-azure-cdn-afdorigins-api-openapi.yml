              schema:
                $ref: '#/components/schemas/AFDOrigin'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: ../../../../../../common-types/resource-management/v6/types.json#/definitions/ErrorResponse
      x-ms-examples:
        AFDOrigins_Create:
          $ref: ./examples/AFDOrigins_Create.json
        AFDOrigins_Create_CustomCertificateSubject:
          $ref: ./examples/AFDOrigins_Create_CustomCertificateSubject.json
        AFDOrigins_Create_IncomingHostHeaderValidation:

  note: 'SCOPE MATTERS HERE. Microsoft ships a real, anonymous, remote MCP server and it answered a live
    `initialize` and `tools/list` on 2026-09-17 — serverInfo "Microsoft Learn MCP Server", version 1.0.0,
    protocolVersion 2025-06-18, three tools, no OAuth challenge. What it exposes is Microsoft Learn DOCUMENTATION
    (search, code-sample search, page fetch), which covers Azure CDN docs, and NOT the Microsoft.Cdn management
    surface. An agent can ask it how to create a CDN profile; it cannot use it to create one. The management
    plane has no MCP server: Azure''s own control-plane server (Azure/azure-mcp, npx -y @azure/mcp@latest)
    ships 32 service areas and cdn/frontdoor is not among them (verified against the repo''s areas/ directory,
    2026-09-17). The candidate_tools block below is what a Microsoft.Cdn MCP server WOULD expose, derived
    from the harvested contract; it is a derivation, not a server that exists.'

provider: microsoft-azure-cdn
deployment:
  mode: remote
  endpoint: https://learn.microsoft.com/api/mcp
  auth: none
  verified: probed
  scope: documentation
  note: >-
    SCOPE MATTERS HERE. Microsoft ships a real, anonymous, remote MCP server and it answered a live
    `initialize` and `tools/list` on 2026-09-17 — serverInfo "Microsoft Learn MCP Server", version
    1.0.0, protocolVersion 2025-06-18, three tools, no OAuth challenge. What it exposes is Microsoft
    Learn DOCUMENTATION (search, code-sample search, page fetch), which covers Azure CDN docs, and NOT
    the Microsoft.Cdn management surface. An agent can ask it how to create a CDN profile; it cannot
    use it to create one. The management plane has no MCP server: Azure's own control-plane server
    (Azure/azure-mcp, npx -y @azure/mcp@latest) ships 32 service areas and cdn/frontdoor is not among
    them (verified against the repo's areas/ directory, 2026-09-17). The candidate_tools block below
    is what a Microsoft.Cdn MCP server WOULD expose, derived from the harvested contract; it is a
    derivation, not a server that exists.
servers:
- name: Microsoft Learn MCP Server
  status: live
  transport: streamable-http
  endpoint: https://learn.microsoft.com/api/mcp
  publisher: Microsoft
  auth: none
  protocol_version: '2025-06-18'
  server_version: 1.0.0
  probed: '2026-09-17'
  tools_file: microsoft-azure-cdn-learn-mcp-tools.json
  covers: Microsoft Learn documentation, including learn.microsoft.com/en-us/rest/api/cdn/
  tools:
  - name: microsoft_docs_search
    description: Search official Microsoft/Azure documentation; up to 10 chunks of max 500 tokens.
    input: [query]
    read_only: true
  - name: microsoft_code_sample_search
    description: Search code snippets and examples in official Microsoft Learn documentation.
    input: [query, language]
    read_only: true
  - name: microsoft_docs_fetch
    description: Fetch a complete Microsoft Learn documentation page as markdown.
    input: [url]
    read_only: true

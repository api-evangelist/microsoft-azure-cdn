provider: microsoft-azure-cdn
headline: >-
  THIS PRODUCT IS RETIRING. Azure CDN Standard from Microsoft (classic) is on a published retirement
  path with a hard date. This is the single most important fact about the product's lifecycle and it
  comes from two independent Microsoft pages, one of them the pricing page itself.
product_status:
  status: retiring
  retirement_date: '2027-09-30'
  new_resource_cutoff: '2025-10-01'
  successor: Azure Front Door Standard / Premium
  successor_repo_hint: microsoft-azure-front-door
  evidence:
  - url: https://azure.microsoft.com/en-us/pricing/details/cdn/
    status: 200
    quote: >-
      "Azure CDN Standard from Microsoft (classic) is in the process of retiring. As of October 1, 2025,
      no new instances will be created. On September 30, 2027, it will be retired. Moving forward, we
      suggest using Azure Front Door, Microsoft's premier CDN service."
  - url: https://learn.microsoft.com/en-us/azure/frontdoor/front-door-cdn-comparison
    status: 200
    quote: >-
      "Azure CDN Standard from Microsoft (classic) is retiring on September 30, 2027. To avoid service
      disruption, migrate to Azure Front Door Standard or Premium." Retirement table gives the cutoff
      date for creating new resources as August 15, 2025.
  note: >-
    The two Microsoft pages state DIFFERENT new-resource cutoff dates — the pricing page says October 1,
    2025 and the comparison table says August 15, 2025. Both are recorded verbatim rather than
    reconciled, because reconciling them would be our guess, not Microsoft's statement. The retirement
    date (September 30, 2027) is consistent across both.
  sibling_retirement:
    product: Azure Front Door (classic)
    retirement_date: '2027-03-31'
    new_resource_cutoff: '2025-03-31'
    evidence: https://learn.microsoft.com/en-us/azure/frontdoor/tier-migration
deprecation_policy:
  published: true
  mechanism: >-
    Azure publishes retirement notices on the product pricing page, in the Azure updates feed, and as a
    banner on every affected documentation page, together with a migration guide and, uniquely here, a
    migration API path in the contract itself.
  headers:
    sunset: false
    deprecation: false
    note: >-
      Microsoft.Cdn does NOT emit RFC 8594 Sunset or Deprecation response headers. Retirement is
      announced out of band (docs, portal, email) and enforced by ARM refusing new resource creation
      after the cutoff — a runtime agent reading only responses gets no warning.
  migration_path:
    docs: https://learn.microsoft.com/en-us/azure/frontdoor/tier-migration
    contract_operations:
    - Profiles_CanMigrate
    - Profiles_CdnCanMigrateToAfd
    - Profiles_Migrate
    - Profiles_CdnMigrateToAfd
    - Profiles_MigrationCommit
    - Profiles_MigrationAbort
    note: >-
      Unusually good: the retirement has a first-class API. The contract ships a validate / migrate /
      commit / abort sequence so the migration off the retiring product is itself automatable, and the
      abort step is reversible until commit (see conventions/microsoft-azure-cdn-conventions.yml).

note: >-
  Two different things are called a "scope" on this API and conflating them is the usual integration
  mistake. (1) The OAUTH SCOPE is coarse: the contract declares exactly one, user_impersonation, and
  the real-world token request asks for https://management.azure.com/.default — neither expresses what
  the caller may do. (2) The AUTHORIZATION SCOPE is an Azure RBAC role assigned at an ARM resource
  scope, and that is what actually gates each of the 115 operations. Both are recorded below; the RBAC
  block is the one that matters.

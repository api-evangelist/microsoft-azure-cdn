problem_types:
- code: ResourceNotFound
  status: 404
  title: The requested resource does not exist
  detail: The profile, endpoint, origin, route, rule set or secret named in the URI is not present in the subscription and resource group.
  remediation: Verify subscriptionId, resourceGroupName and the resource name; list with Profiles_List or Endpoints_ListByProfile first.
  source: https://learn.microsoft.com/en-us/azure/azure-resource-manager/troubleshooting/common-deployment-errors
- code: ResourceGroupNotFound
  status: 404
  title: The resource group does not exist
  detail: The resourceGroupName path parameter names a group that is absent from the subscription.
  source: https://learn.microsoft.com/en-us/azure/azure-resource-manager/troubleshooting/common-deployment-errors
- code: InvalidTemplateDeployment
  status: 400
  title: Request body failed validation
  detail: The Profile, Endpoint, Origin, Route or Rule payload failed resource-provider validation.
  source: https://learn.microsoft.com/en-us/azure/azure-resource-manager/troubleshooting/common-deployment-errors
- code: InvalidResourceName
  status: 400
  title: Resource name is not valid
  detail: CDN profile and endpoint names have a constrained character set and global-uniqueness rule for endpoint hostnames.
  remediation: Call CheckNameAvailability or AFDProfiles_CheckEndpointNameAvailability before Endpoints_Create.
  source: https://learn.microsoft.com/en-us/rest/api/cdn/
- code: AuthorizationFailed
  status: 403
  title: The principal is not authorized for this action
  detail: The Entra ID principal lacks the Microsoft.Cdn/* action required by the operation.
  remediation: Assign CDN Profile Contributor or CDN Endpoint Contributor at the right scope; see scopes/microsoft-azure-cdn-scopes.yml.
  source: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/networking
- code: InvalidAuthenticationTokenTenant
  status: 401
  title: Bearer token is missing, expired, or issued for the wrong tenant
  detail: ARM rejects a token whose audience is not https://management.azure.com/ or whose tenant does not own the subscription.
  source: https://login.microsoftonline.com/common/v2.0/.well-known/openid-configuration
- code: Conflict
  status: 409
  title: The resource is already being modified
  detail: A long-running operation is in flight on the same resource; ARM serialises writes per resource.
  remediation: Poll the Azure-AsyncOperation or Location URL from the prior 202 before retrying.
  source: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/async-operations
- code: TooManyRequests
  status: 429
  title: Throttled by Azure Resource Manager
  detail: The subscription, service-principal or tenant token bucket for this operation type is empty.
  remediation: Honour the Retry-After response header; read x-ms-ratelimit-remaining-subscription-reads / -writes / -deletes to back off before exhaustion.
  source: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/request-limits-and-throttling
- code: MissingSubscriptionRegistration
  status: 409
  title: The Microsoft.Cdn resource provider is not registered on the subscription
  detail: ARM refuses Microsoft.Cdn operations until the provider namespace is registered.
  remediation: 'az provider register --namespace Microsoft.Cdn'
  source: https://learn.microsoft.com/en-us/azure/azure-resource-manager/troubleshooting/error-register-resource-provider
- code: InternalServerError
  status: 500
  title: Unexpected resource-provider failure
  detail: ARM surfaces resource-provider faults through the same envelope; treat as retryable with backoff.
  source: https://learn.microsoft.com/en-us/azure/azure-resource-manager/troubleshooting/common-deployment-errors
